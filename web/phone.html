<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>质检员 · 边测边报</title>
<style>
:root{
  --bg:#000; --card:#111113; --card2:#19191c; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#f5f5f7; --tx2:#a1a1aa; --tx3:#63636b; --tx4:#2e2e33;
  --lime:#c6f43f; --red:#ff5a4e; --amber:#ffb547; --violet:#aa9cff;
  --sans:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --disp:"SF Pro Display",-apple-system,"PingFang SC",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#050506;color:var(--tx);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;place-items:center}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(700px 500px at 50% 40%,rgba(198,244,63,.05),transparent 70%);pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.c-ok{color:var(--lime)} .c-ng{color:#ff8a80} .c-warn{color:var(--amber)} .c-dim{color:var(--tx3)}

.stagewrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.cap{font:500 11px/1 var(--mono);letter-spacing:.2em;color:var(--tx3);text-transform:uppercase}
.device{width:393px;height:852px;border-radius:60px;padding:12px;background:linear-gradient(145deg,#36363c,#141417 40%,#27272c);box-shadow:0 0 0 1px #45454c,0 50px 100px rgba(0,0,0,.7);transform-origin:center;position:relative}
.scr{position:relative;height:100%;border-radius:48px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}

/* 灵动岛提醒 */
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:20;transition:all .45s var(--ease);overflow:hidden;display:flex;align-items:center;gap:12px;padding:0 16px;pointer-events:none}
.island .ic{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;opacity:0;transition:opacity .3s}
.island .tx{opacity:0;transition:opacity .25s;min-width:0}
.island .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.island .tx span{font-size:12.5px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.island.open{width:calc(100% - 20px);height:72px;border-radius:28px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.6)}
.island.open .ic,.island.open .tx{opacity:1;transition-delay:.15s}
.island.ng .ic{background:var(--red)} .island.warn .ic{background:var(--amber)} .island.ok .ic{background:var(--lime)} .island.fix .ic{background:var(--violet)}
.island.ng .tx b{color:#ff8a80} .island.warn .tx b{color:var(--amber)} .island.ok .tx b{color:var(--lime)} .island.fix .tx b{color:var(--violet)}
.island.rec{width:150px}
.island.rec::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

.sb{height:54px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font:600 16px/1 var(--disp)}
.sb .net{font:600 12px var(--sans)} .sb .net.off{color:var(--amber)}

/* 顶部：合同 */
.top{padding:6px 20px 0;display:flex;align-items:center;gap:10px}
.ct{flex:1;min-width:0;text-align:left;padding:8px 12px;margin:0 -12px;border-radius:14px}
.ct:active{background:var(--card)}
.ct small{display:block;font-size:12px;color:var(--tx3)}
.ct b{display:flex;align-items:center;gap:6px;font:600 20px/1.3 var(--mono)}
.ct b i{font-style:normal;color:var(--tx3);font:400 16px var(--sans)}
.ct b.none{font-family:var(--sans);color:var(--lime);font-size:18px}
.ct .nm{display:block;font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icb{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx3);flex:none}
.icb.on{color:var(--lime);border-color:rgba(198,244,63,.4)}

.seg{display:flex;margin:12px 20px 0;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line);flex:none}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;color:var(--tx3);display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s}
.seg button.on{background:var(--card2);color:var(--tx)}
.seg i{width:7px;height:7px;border-radius:50%;background:var(--tx4)}
.seg i.ok{background:var(--lime)} .seg i.ng{background:var(--red)} .seg i.warn{background:var(--amber)}

/* 表单 */
.body{flex:1;min-height:0;overflow:auto;padding:14px 20px 8px;display:flex;flex-direction:column;gap:12px}
.banner{border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.55;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:600}
.banner .dot{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px}
.banner.ok{background:rgba(198,244,63,.09);border:1px solid rgba(198,244,63,.3)} .banner.ok .dot{background:var(--lime)}
.banner.ng{background:rgba(255,90,78,.1);border:1px solid rgba(255,90,78,.35)} .banner.ng .dot{background:var(--red)}
.banner.info{background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;flex:none}
.fr{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:62px;border-bottom:1px solid var(--line);position:relative;transition:background .3s}
.fr:last-child{border-bottom:0}
.fr .lb{flex:none;width:96px}
.fr .lb b{display:block;font-size:15.5px;font-weight:500}
.fr .lb small{display:block;font:11.5px var(--mono);color:var(--tx3);margin-top:1px}
.fr input{flex:1;min-width:0;height:46px;background:none;border:0;outline:none;text-align:right;font:400 22px var(--mono);color:var(--tx);font-variant-numeric:tabular-nums}
.fr input::placeholder{color:var(--tx4);font-size:15px}
.fr .u{flex:none;width:28px;font:12px var(--mono);color:var(--tx3)}
.fr.txt{flex-direction:column;align-items:stretch;gap:0;padding:10px 16px 8px}
.fr.txt .lb{width:auto;display:flex;align-items:baseline;gap:8px}
.fr.txt input{text-align:left;font:16px var(--sans);height:36px}
.fr .tip{position:absolute;right:16px;bottom:4px;font-size:11px;color:var(--tx3)}
.fr.txt .tip{display:none}
.fr.ok input{color:var(--lime)} .fr.ng input{color:#ff8a80} .fr.ng{background:rgba(255,90,78,.06)} .fr.ng .tip{color:#ff8a80}
.fr.voice::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--violet)}
.fr.fresh{animation:fresh 1.2s var(--ease)}
@keyframes fresh{0%{background:rgba(170,156,255,.22)}}
.said{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:11px 14px;display:flex;flex-direction:column;gap:4px;min-height:52px;flex:none}
.said .q{font-size:14px;color:var(--tx)}
.said .q mark{background:none;color:var(--violet)}
.said .q.idle{color:var(--tx3);font-size:13px}
.said .rb{font-size:12.5px;color:var(--tx2);display:flex;gap:8px;align-items:flex-start}
.said .rb[hidden]{display:none}
.said .rb .eq{display:flex;gap:2px;align-items:center;height:16px;flex:none}
.said .rb .eq i{width:2.5px;height:4px;border-radius:2px;background:var(--tx4)}
.said .rb.on .eq i{background:var(--lime);animation:eq .9s ease-in-out infinite}
.said .rb.on .eq i:nth-child(2){animation-delay:.15s}.said .rb.on .eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
#wave{width:100%;height:30px;display:none}
.said.rec #wave{display:block} .said.rec .rb{display:none}

/* 底部 */
.dock{flex:none;padding:10px 20px 6px;display:flex;align-items:center;gap:14px}
.mic{width:66px;height:66px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;position:relative;flex:none;transition:transform .2s,background .25s;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mic svg{stroke:var(--lime)}
.mic:active{transform:scale(.95)}
.mic::before,.mic::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--red);opacity:0}
.mic.on{background:var(--red);border-color:var(--red)} .mic.on svg{stroke:#fff}
.mic.on::before{animation:ring 1.4s infinite} .mic.on::after{animation:ring 1.4s .7s infinite}
.mic.busy{background:var(--violet);border-color:var(--violet)} .mic.busy svg{stroke:#0a0a0b}
.mic.off svg{stroke:var(--tx3)}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.go{flex:1;height:58px;border-radius:18px;background:var(--lime);color:#0a0a0b;font-weight:600;font-size:17px;transition:opacity .2s,transform .15s}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.3}
.hint{flex:none;text-align:center;font-size:12px;color:var(--tx3);padding:0 20px 10px}
.home{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);margin:2px auto 8px;flex:none}

/* 弹层 */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;background:#121214;border-radius:28px 28px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .35s var(--ease);z-index:31;display:flex;flex-direction:column;padding:10px 20px 26px}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 14px;flex:none}
.sheet h3{font:600 17px/1.3 var(--sans);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex:none}
.sheet h3 small{font-size:12px;color:var(--tx3);font-weight:400}
.scroll{overflow:auto;margin:0 -4px;min-height:0}
.ci{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ci b{font:500 15px var(--mono)}
.ci .nm{font-size:12px;color:var(--tx3)}
.ci .st{font-size:12.5px;text-align:right;align-self:center;grid-row:1/3;grid-column:2}
.ci.cur{background:rgba(198,244,63,.05)}
.newc{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;flex:none}
.newc .micro{font-size:12px;color:var(--tx3)}
.newc .row{display:flex;gap:8px}
.newc input{flex:1;min-width:0;height:44px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 12px;outline:none;font-size:15px}
.newc input.m{font-family:var(--mono)}
.newc .err{font-size:12px;color:#ff8a80}
.btn{height:44px;border-radius:12px;background:var(--lime);color:#0a0a0b;font-weight:600;font-size:15px;padding:0 16px}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line);font-weight:500}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rec b{font-weight:500;font-size:14.5px}
.rec .raw{font-size:12px;color:var(--tx3)}
.rec .vd{font-size:12.5px;text-align:right;align-self:center;grid-row:1/3;grid-column:2}

@media (max-width:520px){
  body{display:block;background:#000}
  .stagewrap{display:block;height:100%}
  .cap{display:none}
  .device{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:#000;transform:none!important;margin:0!important}
  .scr{border-radius:0}
  .sb{display:none}
  .top{padding-top:max(14px,env(safe-area-inset-top))}
  .island{top:max(8px,env(safe-area-inset-top))}
  .home{display:none}
  .hint{padding-bottom:max(12px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="stagewrap">
  <div class="device" id="device">
    <div class="scr">
      <div class="island" id="island"><div class="ic" id="islIc"></div><div class="tx"><b id="islT"></b><span id="islS"></span></div></div>
      <div class="sb"><span id="time">--:--</span><span class="net" id="net">在线</span></div>

      <div class="top">
        <button class="ct" id="ctBtn"><small>合同</small><b id="ctH" class="none">选择合同 <i>›</i></b><span class="nm" id="ctP">点这里选择或新建</span></button>
        <button class="icb" id="recsBtn" title="本合同记录"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        <button class="icb" id="spk" title="语音播报"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
      </div>
      <div class="seg" id="tabs"><button data-k="drum"><i></i>卷筒</button><button data-k="travel_drive"><i></i>大车传动</button></div>

      <div class="body" id="body">
        <div id="banner"></div>
        <div class="form" id="form"></div>
        <div class="said" id="said">
          <div class="q idle" id="q">按住麦克风说「直径 1250，光段 300」，会自动填到上面</div>
          <canvas id="wave" width="680" height="60"></canvas>
          <div class="rb" id="rb" hidden><span class="eq"><i></i><i></i><i></i></span><span id="rbp"></span></div>
        </div>
      </div>

      <div class="dock">
        <button class="mic" id="mic" title="按住说话"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="go" id="sub" disabled>提交校验</button>
      </div>
      <div class="hint" id="hint">按住麦克风说话，松开自动识别</div>
      <div class="home"></div>

      <div class="sheet-bg" id="bg"></div>
      <div class="sheet" id="shCt"><div class="grab"></div><h3>选择合同 <small id="ctN"></small></h3>
        <div class="newc"><span class="micro">新建合同</span>
          <div class="row"><input class="m" id="ncCode" placeholder="20261110-10" inputmode="numeric"><button class="btn ghost" id="ncVoice">按住说</button></div>
          <input id="ncName" placeholder="客户名称">
          <div class="err" id="ncErr"></div>
          <button class="btn" id="ncGo">创建并开始录入</button></div>
        <div class="scroll" id="ctList"></div></div>
      <div class="sheet" id="shLs"><div class="grab"></div><h3>本合同记录 <small id="recN"></small></h3><div class="scroll" id="recs"></div></div>
    </div>
  </div>
  <div class="cap">Inspector · 质检员手机端</div>
</div>

<script src="common.js"></script>
<script>
"use strict";
const { esc, KINDS, KIND_LABEL, STATUS_CLS, api, load, store } = QC;
const $ = id => document.getElementById(id);
const P = {
  ht: load('qcp_ht', null), contract: null, status: null, form: load('qcp_form', 'drum'),
  draft: load('qcp_draft', { drum: {}, travel_drive: {} }), vids: load('qcp_vids', { drum: [], travel_drive: [] }),
  voiced: { drum: {}, travel_drive: {} }, latest: { drum: null, travel_drive: null }, result: null,
  tts: load('qcp_tts', false), busy: false, islT: null, level: 0, rec: null, voiceOk: false, pushT: null,
};

function fit() { const d = $('device'); if (innerWidth <= 520) { d.style.transform = ''; return; } const s = Math.min(1, (innerHeight - 70) / 852, (innerWidth - 40) / 393); d.style.transform = `scale(${s})`; d.parentElement.style.margin = `${-(852 * (1 - s)) / 2}px 0`; }
addEventListener('resize', fit); fit();

function island(state, title, sub, ms) {
  const el = $('island'); clearTimeout(P.islT);
  if (!state) { el.className = 'island'; return; }
  if (state === 'rec') { el.className = 'island rec'; return; }
  el.className = 'island open ' + state; $('islT').textContent = title; $('islS').textContent = sub || '';
  $('islIc').innerHTML = state === 'ok' ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>' : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="3" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>';
  P.islT = setTimeout(() => island(null), ms || 4000);
}
function readback(text) { $('rb').hidden = false; $('rbp').textContent = text; $('rb').className = 'rb on'; if (P.tts) QC.speak(text); setTimeout(() => $('rb').className = 'rb', Math.max(1500, text.length * 120)); }
function saveDraft() { store('qcp_draft', P.draft); store('qcp_vids', P.vids); }
function pushDraft() { saveDraft(); clearTimeout(P.pushT); P.pushT = setTimeout(() => QC.publish('draft', { ht_code: P.ht, form: P.form, fields: P.draft[P.form] }, 'phone'), 250); }
function pushFocus() { QC.publish('focus', { ht_code: P.ht, form: P.form }, 'phone'); }
const halfwidth = v => String(v).replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));

/* ---------- 渲染 ---------- */
function rowState(kind, f, v) {
  if (v == null || v === '' || f.type === 'text') return { cls: '', tip: '' };
  const n = halfwidth(v).trim();
  if (!/^-?\d+(\.\d+)?$/.test(n)) return { cls: 'ng', tip: '请填数字' };
  if (((n.split('.')[1] || '').replace(/0+$/, '')).length > 2) return { cls: 'ng', tip: '最多两位小数' };
  const j = QC.prejudge(kind, f.name, n);
  return j.cls === 'ng' ? { cls: 'ng', tip: j.verdict.replace(' · 提交后记为不合格', '') + '·记为不合格' } : j.cls === 'ok' ? { cls: 'ok', tip: '' } : { cls: '', tip: j.verdict };
}
function renderForm(fresh = []) {
  const k = P.form, last = P.latest[k] || {}, d = P.draft[k];
  $('form').innerHTML = QC.fieldsOf(k).map(f => {
    const v = d[f.name] ?? '', st = rowState(k, f, v), txt = f.type === 'text';
    const rule = txt ? '不校验' : QC.rangeText(QC.ruleOf(k, f.name));
    const ph = last[f.name] != null && last[f.name] !== '' ? `上次 ${last[f.name]}` : (txt ? '型号' : '—');
    return `<label class="fr ${txt ? 'txt' : ''} ${st.cls} ${P.voiced[k][f.name] ? 'voice' : ''} ${fresh.includes(f.name) ? 'fresh' : ''}" data-f="${f.name}">
      <span class="lb"><b>${esc(f.label)}</b><small>${esc(rule)}</small></span>
      <input data-f="${f.name}" value="${esc(v)}" placeholder="${esc(ph)}" ${txt ? 'autocapitalize="characters"' : 'inputmode="decimal"'} enterkeyhint="done">
      ${txt ? '' : `<span class="u">${esc(f.unit || '')}</span>`}<span class="tip">${esc(st.tip)}</span></label>`;
  }).join('');
  $('form').querySelectorAll('input').forEach(i => {
    i.oninput = () => {
      const n = i.dataset.f, v = i.value; if (v === '') delete P.draft[k][n]; else P.draft[k][n] = v; delete P.voiced[k][n];
      const row = i.closest('.fr'), st = rowState(k, QC.fieldMeta(k, n), v);
      row.classList.remove('ok', 'ng', 'voice'); if (st.cls) row.classList.add(st.cls); row.querySelector('.tip').textContent = st.tip;
      if (P.result) { P.result = null; renderBanner(); }
      syncSubmit(); pushDraft();
    };
    i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); i.blur(); } };
  });
  syncSubmit();
}
function syncSubmit() {
  const d = P.draft[P.form], n = Object.keys(d).length, bad = QC.fieldsOf(P.form).filter(f => d[f.name] != null && d[f.name] !== '' && f.type !== 'text' && QC.prejudge(P.form, f.name, halfwidth(d[f.name]).trim())?.cls === 'ng').length;
  $('sub').disabled = !P.ht || !n;
  $('sub').textContent = !P.ht ? '先选择合同' : n ? (bad ? `提交（${bad} 项超范围，记为不合格）` : `提交校验（${n} 项）`) : (P.latest[P.form] ? '已提交 · 复测直接重填' : '提交校验');
}
function renderBanner() {
  const r = P.result, b = $('banner');
  if (!P.ht) { b.innerHTML = '<div class="banner info">先点上面选择一个合同，或新建合同。</div>'; return; }
  if (!r) { b.innerHTML = ''; return; }
  b.innerHTML = `<div class="banner ${r.ok ? 'ok' : 'ng'}"><span class="dot">${r.ok ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="3.5" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>' : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'}</span><span><b>${esc(r.title)}</b><br>${r.lines.map(esc).join('<br>')}</span></div>`;
}
function renderMeta() {
  if (P.contract) { $('ctH').className = ''; $('ctH').innerHTML = `${esc(P.contract.ht_code)} <i>›</i>`; $('ctP').innerHTML = `${esc(P.contract.name)} · <span class="c-${STATUS_CLS[P.status?.status] || 'dim'}">${esc(P.status?.status || '')}</span>`; }
  else { $('ctH').className = 'none'; $('ctH').innerHTML = '选择合同 <i>›</i>'; $('ctP').textContent = '点这里选择或新建'; }
  document.querySelectorAll('#tabs button').forEach(b => { const k = b.dataset.k, last = P.latest[k]; b.classList.toggle('on', k === P.form); b.querySelector('i').className = last ? (last.is_qualified === 1 ? 'ok' : last.is_qualified === 0 ? 'ng' : 'warn') : ''; });
  $('mic').classList.toggle('off', !P.voiceOk); $('spk').classList.toggle('on', P.tts);
  $('time').textContent = QC.hhmmss().slice(0, 5);
}
function renderAll(fresh) { renderMeta(); renderBanner(); renderForm(fresh); }
function idleSaid() { $('said').className = 'said'; $('q').className = 'q idle'; $('q').textContent = P.ht ? '按住麦克风说「直径 1250，光段 300」，会自动填到上面' : '选好合同后，按住麦克风说参数和数值'; $('rb').hidden = true; }

/* ---------- 合同 ---------- */
async function selectContract(ht, quiet) {
  if (!ht) { P.ht = null; P.contract = null; P.status = null; P.latest = { drum: null, travel_drive: null }; P.result = null; store('qcp_ht', null); renderAll(); idleSaid(); return; }
  try {
    const d = await api('GET', '/contracts/' + encodeURIComponent(ht));
    if (P.ht !== d.contract.ht_code) { P.draft = { drum: {}, travel_drive: {} }; P.vids = { drum: [], travel_drive: [] }; P.voiced = { drum: {}, travel_drive: {} }; P.result = null; }
    P.ht = d.contract.ht_code; P.contract = d.contract; P.status = { status: d.status, reason: d.status_reason }; P.latest = d.latest;
    store('qcp_ht', P.ht); saveDraft();
    if (!quiet) pushFocus();
    renderAll();
  } catch (e) { if (e.status === 404) selectContract(null); else island('warn', '读取合同失败', e.message); }
}
async function openContracts() {
  sheet('shCt'); $('ncErr').textContent = '';
  try { const s = await api('GET', '/contracts/suggest'); if (!$('ncCode').value) $('ncCode').value = s.ht_code || ''; } catch (e) {}
  const r = await api('GET', '/contracts');
  const order = { '不合格': 0, '未录全': 1, '待校验': 2, '合格': 3 };
  const items = r.items.sort((a, b) => (order[a.status] - order[b.status]) || b.ht_code.localeCompare(a.ht_code));
  $('ctN').textContent = items.length + ' 个';
  $('ctList').innerHTML = items.map(c => `<button class="ci ${c.ht_code === P.ht ? 'cur' : ''}" data-ht="${esc(c.ht_code)}"><b>${esc(c.ht_code)}</b><span class="st c-${STATUS_CLS[c.status]}">${esc(c.status)}</span><span class="nm">${esc(c.name)} · ${esc(c.status_reason || '')}</span></button>`).join('') || '<p class="c-dim" style="padding:12px 4px;font-size:13px">还没有合同</p>';
  document.querySelectorAll('#ctList .ci').forEach(b => b.onclick = () => { sheet(null); idleSaid(); selectContract(b.dataset.ht); });
}
$('ncGo').onclick = async () => {
  $('ncErr').textContent = '';
  const body = { ht_code: $('ncCode').value.trim(), name: $('ncName').value.trim() };
  if (!body.name) { $('ncErr').textContent = '请填写客户名称'; return; }
  try {
    const c = await api('POST', '/contracts?source=phone', body);
    $('ncCode').value = ''; $('ncName').value = ''; sheet(null);
    await selectContract(c.ht_code); island('ok', '合同已创建', `${c.ht_code} · ${c.name}`, 2500);
  } catch (e) { $('ncErr').textContent = e.message + (e.suggestion ? `，可用 ${e.suggestion}` : ''); if (e.suggestion) $('ncCode').value = e.suggestion; }
};

/* ---------- 识别结果 ---------- */
function saidHTML(p) {
  let t = esc(p.corrected || p.text || '');
  (p.matched || []).forEach(m => { if (m.keyword) t = t.split(esc(m.keyword)).join(`<mark>${esc(m.keyword)}</mark>`); });
  return t ? `「${t}」` : '（没有听到声音）';
}
function applyParse(p, from) {
  $('said').className = 'said'; $('q').className = 'q'; $('q').innerHTML = saidHTML(p);
  if (p.form === 'contract') return applyContractParse(p);
  const kind = p.form, names = Object.keys(p.fields || {});
  if (kind !== P.form) { P.form = kind; store('qcp_form', kind); }
  names.forEach(n => { P.draft[kind][n] = p.fields[n]; P.voiced[kind][n] = true; });
  if (p.voice_id && !P.vids[kind].includes(p.voice_id)) P.vids[kind].push(p.voice_id);
  P.result = null; renderAll(names);
  if (!names.length) {
    island('warn', p.message || '没有听出参数', '已转给主管复核；也可以直接在表里填', 4000);
    readback(QC.readbackVoice(p, kind)); return;
  }
  const bad = names.find(n => QC.prejudge(kind, n, p.fields[n])?.cls === 'ng');
  if (bad) { const f = QC.fieldMeta(kind, bad); island('ng', `${f.label} 超出范围`, `${p.fields[bad]} ${f.unit || ''}，允许 ${QC.rangeText(QC.ruleOf(kind, bad))}；可照常提交，记为不合格`, 6000); }
  else if ((p.rejected || []).length) island('warn', '有内容没有填入', p.rejected.map(x => `「${x.said || x.field}」${x.reason}`).join('；'), 4000);
  else island(null);
  readback(QC.readbackVoice(p, kind));
  if (from === 'phone') pushDraft(); else saveDraft();
}
function applyContractParse(p) {
  if (p.fields.ht_code) $('ncCode').value = p.fields.ht_code;
  if (p.fields.name) $('ncName').value = p.fields.name;
  if (!p.fields.ht_code && !p.fields.name) island('warn', '没有听出合同号', p.text || '', 3000);
}

/* ---------- 提交 ---------- */
async function submit() {
  if (!P.ht) return openContracts();
  document.activeElement?.blur?.();
  const body = {}; QC.fieldsOf(P.form).forEach(f => { const v = P.draft[P.form][f.name]; body[f.name] = v == null || v === '' ? (P.latest[P.form]?.[f.name] ?? null) : (f.type === 'text' ? v : halfwidth(v).trim()); });
  $('sub').disabled = true;
  try {
    const vq = P.vids[P.form].length ? '&voice_ids=' + P.vids[P.form].slice(-50).join(',') : '';
    const r = await api('POST', `/contracts/${encodeURIComponent(P.ht)}/records/${P.form}?source=phone${vq}`, body);
    showRecord(r, P.form, 'phone');
  } catch (e) {
    if (e.fields) island('ng', '有字段填写不对', Object.values(e.fields).join('；'));
    else island('warn', '提交失败', e.message);
    syncSubmit();
  }
}
function showRecord(r, kind, from) {
  const v = r.validation, ok = v && v.is_qualified === 1;
  P.latest[kind] = r.record; P.status = r.contract_status;
  P.draft[kind] = {}; P.vids[kind] = []; P.voiced[kind] = {};   // 合格与否都算正常提交，表单清空
  saveDraft();
  if (kind !== P.form) { P.form = kind; store('qcp_form', kind); }
  const next = ok && kind === 'drum' && !P.latest.travel_drive ? '下一步：切到「大车传动」' : '';
  P.result = { ok, title: `${v ? (ok ? `${KIND_LABEL[kind]}参数合格` : `已保存 · ${KIND_LABEL[kind]}参数记为不合格`) : '已保存，校验未完成'} · 记录 #${r.record.id}${from === 'screen' ? '（大屏提交）' : from === 'demo' ? '（演示）' : ''}`,
    lines: ok ? [`合同状态：${r.contract_status.status}${r.contract_status.reason ? '，' + r.contract_status.reason : ''}`, next].filter(Boolean) : v ? [...v.failures, `合同状态：${r.contract_status.status}`, '需要复测时直接重填再提交'] : [r.warning || ''] };
  renderAll();
  island(ok ? 'ok' : v ? 'ng' : 'warn', ok ? `${KIND_LABEL[kind]}参数合格` : v ? `已提交 · 记为不合格` : '校验未完成', ok ? (next || r.contract_status.reason) : v ? v.failures.join('；') : r.warning, ok ? 3200 : 6000);
  readback(QC.readbackRecord(r, kind));
  if (from === 'phone') pushDraft();
  $('body').scrollTop = 0;
}

/* ---------- 录音 ---------- */
async function startRec(form) {
  if (P.busy || P.rec?.on) return;
  if (!P.voiceOk) { const s = QC.micSupport(); island('warn', '现在不能语音输入', s.ok ? '语音识别服务不可用，请直接在表里填' : s.why, 5000); return; }
  if (form !== 'contract' && !P.ht) { openContracts(); return; }
  P.rec = QC.recorder({ onLevel: l => P.level = l, onMax: () => island('warn', '已达到最长录音时间', '60 秒', 2500) });
  P.recForm = form;
  try { if (!await P.rec.start()) return; }
  catch (e) { island('warn', '没有麦克风权限', '请在浏览器设置里允许使用麦克风', 5000); P.rec = null; return; }
  island('rec'); $('mic').classList.add('on'); $('said').className = 'said rec'; $('q').className = 'q'; $('q').textContent = '正在听…';
}
async function stopRec() {
  if (!P.rec) return;
  const r = await P.rec.stop(); P.rec = null; $('mic').classList.remove('on'); island(null); $('said').className = 'said';
  if (!r) return;
  if (r.dur < 0.5) { $('q').textContent = '太短了，按住说完再松开'; return; }
  P.busy = true; $('mic').classList.add('busy'); $('q').textContent = '识别中…';
  try { const p = await QC.sendAudio(r.blob, P.recForm, P.ht, 'phone'); p.form = p.form || P.recForm; applyParse(p, 'phone'); }
  catch (e) { island('warn', '识别失败', e.message); $('q').textContent = e.message; }
  P.busy = false; $('mic').classList.remove('busy');
}
const holdOn = (el, form) => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); startRec(typeof form === 'function' ? form() : form); });
  el.addEventListener('pointerup', e => { e.preventDefault(); stopRec(); });
  el.addEventListener('pointercancel', () => stopRec());
  el.addEventListener('contextmenu', e => e.preventDefault());
};
holdOn($('mic'), () => P.form);
holdOn($('ncVoice'), 'contract');
function waveLoop(t) {
  if (P.rec?.on) {
    const cv = $('wave'), g = cv.getContext('2d'), W = cv.width, H = cv.height, n = 48, w = W / n; g.clearRect(0, 0, W, H);
    for (let i = 0; i < n; i++) { const env = Math.sin(Math.PI * (i + .5) / n), a = (0.12 + 0.88 * P.level * Math.abs(Math.sin(t / 90 + i * .7))) * env, h = Math.max(3, a * H); g.fillStyle = `rgba(255,90,78,${.4 + .6 * env})`; g.fillRect(i * w + w * .3, (H - h) / 2, w * .4, h); }
  }
  requestAnimationFrame(waveLoop);
}

/* ---------- 弹层与按钮 ---------- */
function sheet(id) { ['shCt', 'shLs'].forEach(x => $(x).classList.toggle('on', x === id)); $('bg').classList.toggle('on', !!id); }
async function openRecs() {
  if (!P.ht) return openContracts();
  sheet('shLs');
  const [a, b] = await Promise.all(['drum', 'travel_drive'].map(k => api('GET', `/contracts/${encodeURIComponent(P.ht)}/records/${k}`).then(r => r.items.map(x => ({ ...x, kind: k })))));
  const all = [...a, ...b].sort((x, y) => y.created_at.localeCompare(x.created_at));
  $('recN').textContent = all.length + ' 条';
  $('recs').innerHTML = all.map(x => {
    const fl = QC.fieldsOf(x.kind).filter(f => x[f.name] != null && x[f.name] !== '');
    const vd = x.is_qualified === 1 ? ['ok', '合格'] : x.is_qualified === 0 ? ['ng', '不合格'] : ['warn', '待校验'];
    return `<div class="rec"><b>${KIND_LABEL[x.kind]} #${x.id}</b><span class="vd c-${vd[0]}">${vd[1]}</span><span class="raw">${fl.map(f => `${esc(f.label)} ${esc(x[f.name])}`).join(' · ')}<br>${esc(x.created_at)}</span></div>`;
  }).join('') || '<p class="c-dim" style="font-size:13px;padding:10px 4px">还没有记录</p>';
}
$('ctBtn').onclick = openContracts;
$('recsBtn').onclick = openRecs;
$('sub').onclick = submit;
$('bg').onclick = () => sheet(null);
$('spk').onclick = () => { P.tts = !P.tts; store('qcp_tts', P.tts); renderMeta(); if (P.tts) QC.speak('语音播报已打开'); };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { P.form = b.dataset.k; store('qcp_form', P.form); P.result = null; pushFocus(); renderAll(); idleSaid(); });
// 电脑上按住空格说话（输入框里不触发）
document.addEventListener('keydown', e => { if (/INPUT|TEXTAREA/.test(e.target.tagName)) return; if (e.code === 'Space' && !e.repeat) { e.preventDefault(); startRec(P.form); } });
document.addEventListener('keyup', e => { if (e.code === 'Space' && P.rec) { e.preventDefault(); stopRec(); } });

/* ---------- 演示字幕 ---------- */
function onDemo(d) { $('hint').innerHTML = d.state === 'step' ? `<span class="c-ok">演示 ${d.index + 1}/${d.total}</span> · ${esc(d.caption || '')}` : '按住麦克风说话，松开自动识别'; }

/* ---------- 和大屏联动 ---------- */
QC.onEvent(ev => {
  const d = ev.data || {};
  if (ev.source === 'phone') return;
  if (ev.type === 'voice' && d.form !== 'contract' && d.ht_code && (d.ht_code === P.ht || ev.source === 'demo')) { (d.ht_code === P.ht ? Promise.resolve() : selectContract(d.ht_code, true)).then(() => applyParse(d, ev.source)); }
  else if (ev.type === 'draft' && ev.source === 'demo' && d.ht_code === P.ht && KINDS[d.form]) { P.draft[d.form] = { ...(d.fields || {}) }; saveDraft(); renderForm(); }
  else if (ev.type === 'demo') onDemo(d);
  else if (ev.type === 'focus' && ev.source === 'demo' && d.ht_code) { if (KINDS[d.form]) { P.form = d.form; store('qcp_form', P.form); } selectContract(d.ht_code, true).then(idleSaid); }
  else if (ev.type === 'record' && d.ht_code === P.ht) showRecord(d, d.kind, ev.source);
  else if (ev.type === 'focus' && ev.source === 'screen' && d.ht_code) {
    const msg = d.reason || '主管切换了检验对象';
    if (KINDS[d.form]) { P.form = d.form; store('qcp_form', P.form); }
    selectContract(d.ht_code, true).then(() => { idleSaid(); island('fix', msg, `${d.ht_code} · ${KIND_LABEL[d.form] || ''}`, 5000); readback(`${msg}：合同 ${d.ht_code}，${KIND_LABEL[d.form] || ''}参数。`); });
  }
  else if (ev.type === 'rules') QC.loadRules().then(() => renderAll());
  else if (ev.type === 'contract' && d.contract?.ht_code === P.ht) { if (d.action === 'deleted') selectContract(null); else selectContract(P.ht, true); }
});
QC.bus.onState = m => { const n = $('net'); const on = m === 'live' || m === 'poll'; n.className = 'net' + (on ? '' : ' off'); n.textContent = on ? '在线' : '重连中'; };

/* ---------- 启动 ---------- */
(async () => {
  try { await Promise.all([QC.loadFields(), QC.loadRules()]); }
  catch (e) { island('warn', '连不上主程序', e.message, 60000); return; }
  const vs = await QC.voiceStatus(), mic = QC.micSupport();
  P.voiceOk = !!(vs.available && mic.ok);
  if (!mic.ok) $('hint').textContent = '当前不是 https，不能用麦克风 · 可直接在表里填';
  else if (!vs.available) $('hint').textContent = '语音服务不可用 · 可直接在表里填';
  else if (!vs.loaded) $('hint').textContent = '语音模型加载中…';
  if (P.ht) await selectContract(P.ht, true); else renderAll();
  idleSaid(); pushFocus();
  QC.connect(); QC.presence('phone');
  setInterval(async () => { const s = await QC.voiceStatus(); const ok = !!(s.available && QC.micSupport().ok); if (ok !== P.voiceOk) { P.voiceOk = ok; if (ok) $('hint').textContent = '按住麦克风说话，松开自动识别'; renderMeta(); } $('time').textContent = QC.hhmmss().slice(0, 5); }, 10000);
  requestAnimationFrame(waveLoop);
})();
</script>
</body>
</html>
